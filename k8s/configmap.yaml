apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: billing
data:
  NODE_ENV: production
  PORT: '3000'
  JWT_ALGORITHM: RS256
  JWT_ISSUER: repo-auth-serverless
  JWT_AUDIENCE: async-furious-project
  JWT_EXPIRES_IN: '1800'
  KAFKA_BROKERS: ${kafka_brokers}
  KAFKA_CONSUMER_GROUP: billing-service
  MP_NOTIFICATION_URL: ${mp_notification_url}
  # Mesmo prazo do detector de OS parada do OS Service (padrao 48 h; na demo, minutos).
  MP_PREFERENCE_EXPIRACAO_HORAS: '48'
  # New Relic (#343): configuração só por ambiente, como no Execução. A license key fica no billing-secret.
  NEW_RELIC_NO_CONFIG_FILE: 'true'
  NEW_RELIC_APP_NAME: 'af-billing-hml'
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: 'true'
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: 'true'
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: 'true'
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: 'false'
  NEW_RELIC_LOG: 'stdout'
  # newrelic 14.x: instrumentação do kafkajs atrás de feature flag prerelease (desligada por padrão).
  # Sem ela o trace distribuído não atravessa o broker (#344).
  NEW_RELIC_FEATURE_FLAG_KAFKAJS_INSTRUMENTATION: 'true'
