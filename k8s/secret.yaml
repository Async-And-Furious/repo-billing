# Os ${...} são preenchidos pelo deploy (scripts/deploy/render-k8s.mjs). DATABASE_URL é montada
# por scripts/deploy/infra.sh a partir do secret tc3-db-billing-<env> (role billing_app,
# connection_limit=3). Nenhum valor real fica neste arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: billing-secret
  namespace: billing
type: Opaque
stringData:
  DATABASE_URL: ${database_url}
  JWT_PUBLIC_KEY: ${jwt_public_key}
  KAFKA_SASL_USERNAME: ${kafka_sasl_username}
  KAFKA_SASL_PASSWORD: ${kafka_sasl_password}
  MP_ACCESS_TOKEN: ${mp_access_token}
