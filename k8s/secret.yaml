# DATABASE_URL (banco billing, role billing_app, connection_limit=3) vem do Secrets Manager
# tc3-db-billing-<env>, entregue pelo Epic #312. Os valores abaixo sao placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: billing-secret
  namespace: billing
type: Opaque
stringData:
  DATABASE_URL: ${database_url}
  JWT_PUBLIC_KEY: ${jwt_public_key}
  KAFKA_SASL_USERNAME: ${kafka_sasl_username}
  KAFKA_SASL_PASSWORD: ${kafka_sasl_password}
  MP_ACCESS_TOKEN: ${mp_access_token}
