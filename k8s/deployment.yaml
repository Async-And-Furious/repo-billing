apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: billing
spec:
  replicas: ${app_replicas}
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ${app_image}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
              ephemeral-storage: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
              ephemeral-storage: '512Mi'
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
