# Seed de demonstracao, so para HML (DEPLOY_ENV=hml; o script recusa qualquer outro ambiente).
# Roda depois do billing-migrate, com a mesma imagem; nunca aplicar em producao.
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-seed-hml
  namespace: billing
  labels:
    app: billing-api
    job: seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: billing-api
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: ${app_image}
          imagePullPolicy: IfNotPresent
          command: ["node", "prisma/seed.mjs"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: DEPLOY_ENV
              value: hml
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
